# Local deployment. See README.md for client and authentication settings.
#
#   mkdir -p data && cp config.example.json data/config.json
#   docker compose up -d
#
# Most file settings reload at watch_seconds intervals. Environment overrides
# still take precedence; changing a container's environment requires recreation.

services:
  cline-pin-proxy:
    image: ghcr.io/thinker-joe/cline-pin-proxy:latest
    # To build locally, uncomment build and run docker compose up -d --build.
    # build: .
    container_name: cline-pin-proxy
    restart: unless-stopped

    ports:
      # Publish only on the host's loopback interface.
      - "127.0.0.1:8787:8787"

    environment:
      # Empty values allow the file and application defaults to take effect.
      CLINE_PIN_UPSTREAM: ${CLINE_PIN_UPSTREAM:-}
      # A fixed upstream key replaces the client's Authorization header.
      CLINE_PIN_API_KEY: ${CLINE_PIN_API_KEY:-}
      CLINE_PIN_FORWARD_HEADERS: ${CLINE_PIN_FORWARD_HEADERS:-}
      # Log level has no configuration-file equivalent.
      CLINE_PIN_LOG_LEVEL: ${CLINE_PIN_LOG_LEVEL:-info}

    # Mount the directory to support atomic file replacement. A missing file
    # can be created later and detected by the configuration watcher.
    volumes:
      - ./data:/etc/cline-pin-proxy
    command: ["serve", "-config", "/etc/cline-pin-proxy/config.json"]

    healthcheck:
      test: ["CMD", "/usr/local/bin/cline-pin-proxy", "healthcheck", "-url", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Use a read-only root filesystem; the data mount remains writable.
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
