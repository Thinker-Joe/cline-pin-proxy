name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  GO_VERSION: '1.25'

jobs:
  # Verify the same commit before publishing, including tag and manual runs.
  # The separate CI workflow does not establish this dependency.
  verify:
    name: Verify before publishing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt
        run: |
          set -eu
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "以下文件未格式化："
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test (race)
        run: go test -race ./...

      - name: go.mod is tidy
        run: |
          set -eu
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "go.mod / go.sum 未同步，请本地执行 go mod tidy 后提交"
            exit 1
          fi

      # CHANGELOG.md 是 Release 正文的唯一来源，缺条目就不要发布任何产物。
      - name: Changelog entry for this tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          if ! grep -qF "## [$version]" CHANGELOG.md; then
            echo "CHANGELOG.md 缺少 [${version}] 小节，无法发布 ${GITHUB_REF_NAME}"
            echo "请先把 [Unreleased] 的内容整理进 '## [${version}] - YYYY-MM-DD' 并推到 main"
            exit 1
          fi
          echo "CHANGELOG.md 已包含 [${version}] 小节"

  # Publish multi-architecture images after verification.
  docker:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR requires lowercase image names.
      - name: Compute lowercase image name
        id: image
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (for arm64 cross-build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Job summary
        run: |
          {
            echo "### 镜像已推送"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "平台: linux/amd64, linux/arm64"
            echo ""
            echo "拉取: \`docker pull ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Attach binaries to GitHub Releases for version tags.
  binaries:
    name: Attach binaries to release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 需要完整 tag 列表来生成与上一个版本的 compare 链接。
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build binaries for all platforms
        run: |
          set -eu
          mkdir -p dist
          version="${{ github.ref_name }}"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            out="dist/cline-pin-proxy_${version}_${os}_${arch}"
            if [ "$os" = "windows" ]; then out="${out}.exe"; fi
            echo "building $out"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -buildvcs=false \
                -ldflags="-s -w -X main.version=${version}" \
                -o "$out" ./cmd/cline-pin-proxy
          done
          ls -lh dist

      # 取 CHANGELOG.md 中本 tag 对应的小节作为 Release 正文。
      - name: Extract release notes from CHANGELOG.md
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          awk -v want="## [$version]" '
            index($0, want) == 1 { inside = 1; next }
            inside && (substr($0, 1, 4) == "## [" || substr($0, 1, 1) == "[") { exit }
            inside { print }
          ' CHANGELOG.md > release-notes.md

          prev="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -n "$prev" ]; then
            printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
              "$GITHUB_REPOSITORY" "$prev" "$GITHUB_REF_NAME" >> release-notes.md
          fi

          sed -i '/./,$!d' release-notes.md   # 去掉小节标题后的空行
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md 的 [${version}] 小节为空"
            exit 1
          fi
          echo "----- release notes -----"
          cat release-notes.md

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release-notes.md
          fail_on_unmatched_files: true
